services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fire_extinguisher_db
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    environment: &backend_env
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fire_extinguisher_db
      DB_USER: postgres
      DB_PASSWORD: ""
      JWT_SECRET: change-this-compose-secret-before-production
      JWT_EXPIRES_IN: 8h
      EXTINGUISHER_STATUS_CRON: "0 0 * * *"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5000
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: IYAMUREMYESERGINE241@GMAIL.COM
      SMTP_PASS: nppy exay eted xmaz
      AUTH_SERVICE_URL: http://auth-service:5001
      USER_SERVICE_URL: http://user-service:5002
      EXTINGUISHER_SERVICE_URL: http://extinguisher-service:5003
      INSPECTION_SERVICE_URL: http://inspection-service:5004
      MAINTENANCE_SERVICE_URL: http://maintenance-service:5005
      REPORTING_SERVICE_URL: http://reporting-service:5006
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - user-service
      - extinguisher-service
      - inspection-service
      - maintenance-service
      - reporting-service
      - notification-service

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    environment:
      <<: *backend_env
      PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      - postgres

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    environment:
      <<: *backend_env
      PORT: 5002
    ports:
      - "5002:5002"
    depends_on:
      - postgres

  extinguisher-service:
    build:
      context: .
      dockerfile: backend/extinguisher-service/Dockerfile
    environment:
      <<: *backend_env
      PORT: 5003
    ports:
      - "5003:5003"
    depends_on:
      - postgres

  inspection-service:
    build:
      context: .
      dockerfile: backend/inspection-service/Dockerfile
    environment:
      <<: *backend_env
      PORT: 5004
    ports:
      - "5004:5004"
    depends_on:
      - postgres

  maintenance-service:
    build:
      context: .
      dockerfile: backend/maintenance-service/Dockerfile
    environment:
      <<: *backend_env
      PORT: 5005
    ports:
      - "5005:5005"
    depends_on:
      - postgres

  reporting-service:
    build:
      context: .
      dockerfile: backend/reporting-service/Dockerfile
    environment:
      <<: *backend_env
      PORT: 5006
    ports:
      - "5006:5006"
    depends_on:
      - postgres

  notification-service:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
    environment:
      <<: *backend_env
      PORT: 5007
    ports:
      - "5007:5007"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
